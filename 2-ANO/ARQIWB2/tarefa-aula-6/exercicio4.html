<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 4 - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: white;
            padding: 20px;
            width: 300px;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #9C27B0;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Login</h1>

    <form>
        <label>Usuário:</label>
        <input type="text" name="usuario" required placeholder="Digite seu usuário">

        <label>Senha:</label>
        <input type="password" name="senha" minlength="6" required placeholder="Mínimo 6 caracteres">

        <button type="submit">Entrar</button>
    </form>

</body>
</html>
