<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1 - Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: white;
            padding: 20px;
            width: 300px;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Formulário de Cadastro</h1>

    <form>
        <label>Nome:</label>
        <input type="text" name="nome" minlength="3" required placeholder="Digite seu nome">

        <label>E-mail:</label>
        <input type="email" name="email" required placeholder="Digite seu e-mail">

        <label>Senha:</label>
        <input type="password" name="senha" minlength="8" required placeholder="Mínimo 8 caracteres">

        <label>Data de Nascimento:</label>
        <input type="date" name="nascimento" required>

        <button type="submit">Cadastrar</button>
    </form>

</body>
</html>
