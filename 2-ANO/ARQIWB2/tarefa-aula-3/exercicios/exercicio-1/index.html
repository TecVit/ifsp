<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 1</title>
</head>
<body>
  <h1>Formulário de Contato</h1>

  <form>
    <label for="nome">Nome:</label>
    <input type="text" name="nome" id="nome" required>

    <label for="endereco">Endereço:</label>
    <input type="text" name="endereco" id="endereco" required>

    <label for="bairro">Bairro:</label>
    <input type="text" name="bairro" id="bairro" required>

    <label for="cidade">Cidade:</label>
    <input type="text" name="cidade" id="cidade" required>

    <label for="cep">CEP:</label>
    <input type="text" name="cep" id="cep" pattern="\d{5}-\d{3}" placeholder="12345-678" required>

    <label for="cpf">CPF:</label>
    <input type="text" name="cpf" id="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="123.456.789-00" required>

    <label for="celular">Telefone Celular:</label>
    <input type="text" name="celular" id="celular" pattern="\(0\d{2}\)9\d{4}-\d{4}" placeholder="(011)91234-5678" required>

    <input type="submit" value="Enviar">
  </form>
</body>
</html>
