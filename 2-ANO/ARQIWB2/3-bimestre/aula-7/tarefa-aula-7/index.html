<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cápsula do Tempo Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cápsula do Tempo Digital</h1>
        <p id="contador-visitas"></p>
    </header>

    <hr>

    <section>
        <h2>Palavra da aula</h2>
        <input type="text" id="palavra-aula" placeholder="Digite a palavra que o professor falou">
        <button class="botao" id="botao-salvar-palavra">Salvar palavra</button>
        <p id="status-palavra"></p>
    </section>

    <hr>

    <section>
        <h2>Escreva uma mensagem para o seu eu do futuro</h2>
        <textarea id="mensagem" placeholder="Escreva uma mensagem para o seu eu do futuro..."></textarea>
        <br>
        <button class="botao" id="botao-salvar-mensagem">Salvar mensagem</button>
    </section>

    <hr>

    <section>
        <h2>Mensagens guardadas</h2>
        <ul id="lista-mensagens"></ul>
    </section>

    <script src="./js/script.js"></script>

</body>
</html>
